name: Deploy Flashscore F1 Live Scores to GitHub Pages

on:
  # Run every 5 minutes to fetch updated live scores
  schedule:
    - cron: '*/5 * * * *'
  # Also run on pushes to the main branch
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository with full history (needed for gh‑pages deployment)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Python for fetching live scores
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install required Python packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # Fetch live scores from Flashcore and save the HTML snapshot
      - name: Fetch live scores from Flashscore
        run: python fetch_scores.py

      # Deploy the generated html to GitHub Pages using the official action
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
